name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Smoke run (offline, no API key)
        run: |
          python -m forecast_ai compare --dataset footfall --horizon 14 --folds 2 --charts-dir /tmp/charts --report /tmp/report.md
          python -m forecast_ai forecast --dataset sales --horizon 7 --model hw
